name: End-to-end

# Separate from the Build workflow on purpose: this one needs a Jahia, a licence secret and several
# minutes, where Build is the fast gate that should run on every push. A red unit build should not
# be waiting behind a container pull.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, which is what the snapshot provisioning manifest is for.
    - cron: '0 2 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The licence is an organisation secret; a fork PR cannot read it, and a run without it would
    # fail on container start rather than on anything this repository did.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Node >= 20.19: @jahia/cypress 8.x pulls @faker-js/faker v10, which refuses to install on
      # anything older, and the failure reads like a repository problem rather than a toolchain one.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: yarn
          cache-dependency-path: tests/yarn.lock

      - name: Build the module and its test module
        run: |
          mvn -B clean install -DskipTests
          mvn -B clean install -DskipTests -f tests/jahia-module/pom.xml

      - name: Start Jahia
        working-directory: tests
        env:
          JAHIA_LICENSE: ${{ secrets.JAHIA_LICENSE }}
        run: |
          docker compose up -d
          timeout 600 bash -c 'until curl -sf http://localhost:8080/cms/login > /dev/null; do sleep 10; done'

      - name: Provision the dependencies
        working-directory: tests
        run: |
          curl -sf -u root:root1234 -X POST http://localhost:8080/modules/api/provisioning \
            -H "Origin: http://localhost:8080" -H "Content-Type: application/yaml" \
            --data-binary @provisioning-manifest-build.yml

      # An uploaded bundle is referenced by its FILE NAME, not by a path or a file: URL, and one
      # call carries one bundle. Getting either wrong does not fail the step: the API answers 200
      # with empty install/start lists and deploys nothing, which surfaces minutes later as the
      # accordion simply not being there.
      - name: Deploy the module
        working-directory: tests
        run: |
          curl -sf -u root:root1234 -X POST http://localhost:8080/modules/api/provisioning \
            -H "Origin: http://localhost:8080" \
            -F 'script=[{"installBundle":["browse-content-types-1.0.0-SNAPSHOT.jar"],"autoStart":true}]' \
            -F file=@../target/browse-content-types-1.0.0-SNAPSHOT.jar

      - name: Deploy the test module
        working-directory: tests
        run: |
          curl -sf -u root:root1234 -X POST http://localhost:8080/modules/api/provisioning \
            -H "Origin: http://localhost:8080" \
            -F 'script=[{"installBundle":["browse-content-types-test-module-1.0.0-SNAPSHOT.jar"],"autoStart":true}]' \
            -F file=@jahia-module/target/browse-content-types-test-module-1.0.0-SNAPSHOT.jar

      - name: Run the suite
        working-directory: tests
        env:
          JAHIA_URL: http://localhost:8080
          SUPER_USER_PASSWORD: root1234
        run: |
          yarn install --frozen-lockfile
          yarn e2e:ci

      - name: Keep the artifacts whatever the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/results
          retention-days: 7

      - name: Jahia log, for triage
        if: failure()
        working-directory: tests
        run: docker compose logs jahia | tail -500
