name: End-to-end

# Run through the organisation's shared integration-test workflow rather than a pipeline of this
# repository's own, for one reason above the others: the suite needs a Jahia, Jahia publishes no
# Community image, and an Enterprise image will not start without a licence. The shared workflow is
# given that licence by the organisation through `secrets: inherit`, so **no licence is ever stored
# on this repository** - which matters here more than elsewhere, because this repository is public
# and anybody with write access can read a secret it holds.
#
# The hand-rolled pipeline this replaces read `secrets.JAHIA_LICENSE` from this repository, where
# nobody had put one, so it failed on container start every night since it was added.
#
# Modelled on jcontent, which runs this same harness: the same `@jahia/cypress` (8.6.0), the same
# `tests/ci.*.sh` shims, and the same `tests/jahia-module` test module beside the module itself.
# What the shared workflow invokes is those shims, which resolve the pinned @jahia/cypress and
# delegate to it - which is also why no Dockerfile appears anywhere: @jahia/cypress builds the
# test image.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, which is what the snapshot provisioning manifest is for.
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the module and the test module beside it, and publishes both as the artifact the
      # integration job collects by `artifact_prefix`.
      #
      # Deliberately without jcontent's private build container and Nexus credentials: everything
      # this module depends on resolves from public repositories, and adding those would make a
      # public repository need two more organisation secrets to build at all.
      - uses: jahia/jahia-modules-action/build@v2

  integration-tests:
    name: Integration Tests
    needs: build
    # The licence, and everything else the harness needs, comes from the organisation. Nothing is
    # read from this repository's own secrets.
    secrets: inherit
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    with:
      module_id: browse-content-types
      module_branch: ${{ github.ref }}
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      provisioning_manifest: provisioning-manifest-build.yml
      artifact_prefix: browse-content-types-${{ github.event.pull_request.number }}
      should_skip_testrail: true
      testrail_project: Browse Content Types
      timeout_job: 45
