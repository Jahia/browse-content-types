# A Jahia for the suite to run against, locally or in CI.
#
# Mirrors the shape jContent's own tests use, trimmed to what this module needs: there is no
# cluster variant here and no custom JVM wiring, so a run against a plain locally provisioned Jahia
# behaves the same as a run against this stack. That matters - a suite whose environment is only
# reproducible through its own compose file reads every environment failure as a product defect.
services:
    mariadb:
        image: library/mariadb:10-focal
        container_name: bct-mariadb
        networks:
            - stack
        command: --max_allowed_packet=1073741824 --transaction-isolation=READ-UNCOMMITTED --innodb-lock-wait-timeout=10
        environment:
            MYSQL_ROOT_PASSWORD: root1234
            MYSQL_DATABASE: jahia
            MYSQL_USER: jahia
            MYSQL_PASSWORD: jahia

    jahia:
        image: '${JAHIA_IMAGE:-jahia/jahia-ee-dev:8.2}'
        container_name: bct-jahia
        restart: 'no'
        depends_on:
            - mariadb
        environment:
            JAHIA_LICENSE: ${JAHIA_LICENSE}
            SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD:-root1234}
            PROCESSING_SERVER: 'true'
            MAX_RAM_PERCENTAGE: 80
            RESTORE_MODULE_STATES: 'false'
            DB_VENDOR: mariadb
            DB_HOST: mariadb
            DB_NAME: jahia
            DB_USER: jahia
            DB_PASS: jahia
        ports:
            - '8080:8080'
        networks:
            - stack

networks:
    stack:
